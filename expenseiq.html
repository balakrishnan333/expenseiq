<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExpenseIQ · Smart Money. Simple Life.</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--red:#FF4D5A;--purple:#7C5CFC;--blue:#4D8DFF;--green:#2BCB8A;--orange:#FF9F43;--pink:#FF6FB5;--bg:#F7F8FC;--card:#fff;--text:#171927;--muted:#737785;--border:#E9EAF0;--grad:linear-gradient(135deg,#FF4D5A,#FF6FB5);--shadow:0 8px 30px rgba(23,25,39,.06);--r:20px}
[data-theme=dark]{--bg:#101116;--card:#181A22;--text:#fff;--muted:#9CA3AF;--border:#262936;--shadow:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem}.logo i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--purple))}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{cursor:pointer;padding:.8rem 1.4rem;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:transform .2s;background:var(--card);border:1px solid var(--border)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 20px rgba(255,77,90,.3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;animation:rise .5s both}
.hov:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(124,92,252,.18)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--card);border-right:1px solid var(--border);padding:1.25rem;display:flex;flex-direction:column;gap:.25rem;z-index:50;transition:transform .3s}
.side .logo{margin-bottom:1.5rem}.side a{padding:.7rem .9rem;border-radius:12px;color:var(--muted);font-weight:600;font-size:.92rem;transition:.2s}
.side a:hover{background:var(--bg);color:var(--text)}.side a.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,77,90,.3)}.side hr{border:0;border-top:1px solid var(--border);margin:auto 0 .5rem}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}.veil.open{display:block}
.wrap{margin-left:240px;min-height:100vh}
.top{display:flex;align-items:center;gap:.8rem;padding:1rem 2rem;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);z-index:30}
.top .search{flex:1;max-width:460px;padding:.7rem 1rem;border-radius:14px;border:1px solid var(--border);background:var(--card)}.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--border);width:42px;height:42px;border-radius:12px;cursor:pointer;flex:none}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;display:grid;place-items:center;font-weight:700}.burger{display:none}
main{padding:1rem 2rem 3rem;max-width:1300px}h1{font-size:1.9rem;letter-spacing:-.02em}.sub{color:var(--muted);margin:.25rem 0 1.5rem}
.grid{display:grid;gap:1.25rem}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.ga{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.gc{grid-template-columns:1fr 1fr}
.stat small{color:var(--muted);font-weight:600}.stat h2{font-size:1.8rem;margin:.3rem 0}.up{color:var(--green)}.down{color:var(--red)}
.s0{background:#F1ECFF}.s1{background:#E3F8EF}.s2{background:#FFE9EB}.s3{background:#E7F0FF}
[data-theme=dark] .s0{background:#2a2350}[data-theme=dark] .s1{background:#12382c}[data-theme=dark] .s2{background:#3d1d24}[data-theme=dark] .s3{background:#1c2c4d}
.bar{height:8px;border-radius:9px;background:var(--border);overflow:hidden;margin:.5rem 0}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.2rem;flex:none;transition:transform .2s}.card:hover .ico{transform:scale(1.1)}
.row{display:flex;align-items:center;gap:.9rem;padding:.7rem 0}.row .g{flex:1;min-width:0}.row .g b,.row .g small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--muted)}.amt{font-weight:700;white-space:nowrap;text-align:right}.amt.in{color:var(--green)}
.ins{background:linear-gradient(135deg,#7C5CFC,#FF6FB5 55%,#FF4D5A);color:#fff;border:0}.ins small{color:#fffb}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:var(--card);padding:.5rem 1rem;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.85rem;transition:.2s}.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.field{display:block;margin-bottom:1rem;font-weight:600;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:.35rem;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.field.err input,.field.err select{border-color:var(--red)}.field input:focus{border-color:var(--red)}
.fab{position:fixed;right:2rem;bottom:2rem;width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;font-size:2rem;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,77,90,.4);z-index:35;transition:transform .2s}.fab:hover{transform:rotate(90deg) scale(1.08)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:1rem;z-index:80}.modal .card{width:100%;max-width:440px;animation:pop .25s both}
#toasts{position:fixed;top:1rem;right:1rem;display:grid;gap:.5rem;z-index:100}.toast{padding:.85rem 1.2rem;border-radius:14px;color:#fff;font-weight:600;box-shadow:var(--shadow);animation:rise .3s both;transition:opacity .3s}
.toast.success{background:var(--green)}.toast.warning{background:var(--orange)}.toast.error{background:var(--red)}.toast.info{background:var(--blue)}
.bnav{display:none}.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.pay label{border:1px solid var(--border);border-radius:12px;padding:.7rem;text-align:center;cursor:pointer;font-weight:600}.pay input{display:none}.pay label:has(input:checked){background:var(--grad);color:#fff;border-color:transparent}
.field input.big{font-size:2.4rem;font-weight:800;text-align:center}.cb{position:relative;height:280px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;text-align:center}.cal small{font-weight:700}
.cal button{aspect-ratio:1;border:1px solid var(--border);background:var(--card);border-radius:12px;cursor:pointer;display:grid;place-items:center;align-content:center;font-weight:600;transition:.2s}.cal button:hover{border-color:var(--red)}.cal button.on{background:var(--grad);color:#fff}
.cal i{width:7px;height:7px;border-radius:50%;display:block;margin-top:2px}
.tg{width:46px;height:26px;appearance:none;background:var(--border);border-radius:99px;position:relative;cursor:pointer;transition:.2s;flex:none}.tg:checked{background:var(--red)}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg:checked::after{left:23px}
/* landing */
.lh{display:flex;align-items:center;justify-content:space-between;padding:1rem 5vw;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);z-index:30}
.lh nav{display:flex;gap:2rem;font-weight:600;font-size:.92rem}.lh nav a:hover{color:var(--red)}.act{display:flex;gap:.6rem}
section{padding:4rem 5vw}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:3rem;align-items:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.8rem,6vw,4.8rem);line-height:1.05}.hero h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:-1}.prev{animation:float 6s ease-in-out infinite;position:relative}.fl{position:absolute;left:-8%;bottom:-10%;animation:float 5s 1s ease-in-out infinite}
.cta{background:linear-gradient(135deg,var(--red),var(--purple));color:#fff;text-align:center;border-radius:32px;margin:0 5vw}.h2{font-size:clamp(1.8rem,4vw,2.6rem);text-align:center;margin-bottom:2rem;letter-spacing:-.02em}
footer{padding:3rem 5vw;display:flex;flex-wrap:wrap;gap:2rem;justify-content:space-between;color:var(--muted)}footer div{display:grid;gap:.4rem}
.chat{max-width:680px;margin:0 auto}.msg{padding:.8rem 1rem;border-radius:16px;margin:.6rem 0;max-width:85%;animation:rise .3s both}.msg.u{background:var(--grad);color:#fff;margin-left:auto}.msg.a{background:var(--bg);border:1px solid var(--border)}
.aform{display:flex;gap:.5rem;margin-top:.8rem}.aform input{flex:1;min-width:0;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--border);background:var(--bg)}
@media(max-width:1199px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}main{padding:1rem 1.25rem 6rem}}
@media(max-width:1023px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:var(--shadow)}.wrap{margin-left:0}.burger{display:block}.top{padding:.8rem 1.25rem}.g3{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}
@media(max-width:767px){.g4.k2{grid-template-columns:1fr 1fr}.g4,.g3,.gc{grid-template-columns:1fr}.g4.k2{grid-template-columns:1fr 1fr}.lh nav,.top .search,.uname{display:none}h1{font-size:1.5rem}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);justify-content:space-around;padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom));z-index:45}
.bnav a{font-size:.7rem;text-align:center;color:var(--muted);font-weight:600;padding:.3rem .6rem}.bnav a.on{color:var(--red)}.bnav span{display:block;font-size:1.2rem}
.fab{right:1rem;bottom:5rem}.pay{grid-template-columns:1fr 1fr}.hero{padding-top:2rem}.fl{display:none}.lh .btn{padding:.6rem 1rem}}
</style></head>
<body><div id="root"></div><div id="toasts"></div>
<script>
/* ---------- data service (replace bodies with API calls later) ---------- */
const CATS={Food:['🍔','#FF4D5A'],Shopping:['🛍️','#7C5CFC'],Transport:['🚗','#4D8DFF'],Bills:['💡','#FF9F43'],Entertainment:['🎬','#FF6FB5'],Subscription:['🎧','#2BCB8A'],Groceries:['🛒','#2BCB8A'],Salary:['💰','#2BCB8A']};
const $=s=>document.querySelector(s),inr=n=>'₹'+Math.abs(n).toLocaleString('en-IN');
const day=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toISOString().slice(0,10)};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('eiq_'+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem('eiq_'+k,JSON.stringify(v))};
const SEED=[['Swiggy','Food',-420,0],['Spotify','Subscription',-119,0],['Petrol Pump','Transport',-1500,0],['Amazon','Shopping',-2499,1],['Netflix','Entertainment',-649,1],['Mobile Recharge','Bills',-299,1],['BigBasket','Groceries',-980,1],['Salary','Salary',30000,2],['Zomato','Food',-680,3],['Uber','Transport',-320,3],['Electricity Bill','Bills',-1450,4],['Myntra','Shopping',-1601,5],['Cinema','Entertainment',-800,6],['Dominos','Food',-540,7],['Ola','Transport',-430,8],['Internet','Bills',-799,9],['Starbucks','Food',-360,10],['Zara','Shopping',-2100,12]].map((t,i)=>({id:'t'+i,name:t[0],category:t[1],amount:t[2],date:day(t[3]),method:'UPI'}));
const API={
 getTransactions:()=>LS.get('tx',SEED).sort((a,b)=>b.date.localeCompare(a.date)),
 addTransaction(t){const l=API.getTransactions();l.unshift({id:'t'+Date.now(),...t});LS.set('tx',l)},
 deleteTransaction:id=>LS.set('tx',API.getTransactions().filter(t=>t.id!==id)),
 getGoals:()=>LS.get('goals',[{name:'New Laptop',icon:'💻',color:'#7C5CFC',current:42000,target:70000},{name:'Trip to Goa',icon:'✈️',color:'#4D8DFF',current:18500,target:50000},{name:'Bike',icon:'🏍️',color:'#FF4D5A',current:12000,target:60000},{name:'Education',icon:'🎓',color:'#2BCB8A',current:8000,target:40000}]),
 addGoal(g){LS.set('goals',[...API.getGoals(),g])},
 getRecurring:()=>LS.get('rec',[['Netflix',649,'🎬','#FF4D5A'],['Spotify',119,'🎧','#2BCB8A'],['Internet',799,'📡','#4D8DFF'],['Mobile',499,'📱','#FF9F43'],['Cloud Storage',130,'☁️','#7C5CFC']].map(r=>({name:r[0],amount:r[1],icon:r[2],color:r[3]}))),
 addRecurring(r){LS.set('rec',[...API.getRecurring(),r])},
 getSettings:()=>LS.get('settings',{name:'Vinoth',email:'vinoth@gmail.com',dark:false,currency:'INR',monday:true,n1:true,n2:true,n3:true}),
 saveSettings:s=>LS.set('settings',s)};
/* ---------- helpers ---------- */
function toast(m,t='success'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},2800)}
const applyTheme=()=>document.documentElement.dataset.theme=API.getSettings().dark?'dark':'light';applyTheme();
function countUp(el,to){const t0=performance.now();(function f(n){const p=Math.min((n-t0)/1000,1);el.textContent=inr(Math.round(to*(1-(1-p)**3)));if(p<1)requestAnimationFrame(f)})(t0)}
function modal(title,fields,cb){const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<form class="card"><h2 style="margin-bottom:1rem">${title}</h2>${fields.map(f=>`<label class="field">${f[1]}<input name="${f[0]}" type="${f[2]||'text'}" value="${f[3]??''}"></label>`).join('')}<div style="display:flex;gap:.6rem"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Save</button></div></form>`;
 document.body.append(m);const close=()=>m.remove();m.onclick=e=>{if(e.target==m||e.target.dataset.x!==undefined)close()};
 m.querySelector('form').onsubmit=e=>{e.preventDefault();if(cb(Object.fromEntries(new FormData(e.target)))!==false)close()}}
const line=(id,labels,data,c='#FF4D5A',axes=true)=>{const cv=document.getElementById(id),x=cv.getContext('2d'),g=x.createLinearGradient(0,0,0,cv.height||280);g.addColorStop(0,c+'55');g.addColorStop(1,c+'00');
 return new Chart(cv,{type:'line',data:{labels,datasets:[{data,borderColor:c,backgroundColor:g,fill:true,tension:.4,pointRadius:0,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:axes,grid:{display:false}},y:{display:axes,grid:{color:'#8883'},ticks:{callback:v=>'₹'+v/1000+'K'}}}}})};
const byCat=()=>{const o={};API.getTransactions().filter(t=>t.amount<0).forEach(t=>o[t.category]=(o[t.category]||0)-t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const txRow=(t,del)=>`<div class="row"><span class="ico" style="background:${(CATS[t.category]||['','#888'])[1]}22">${(CATS[t.category]||['💸'])[0]}</span><div class="g"><b>${t.name}</b><small>${t.category} · ${t.date}</small></div><span class="amt ${t.amount>0?'in':''}">${t.amount<0?'-':'+'}${inr(t.amount)}</span>${del?`<button class="ib" style="width:34px;height:34px" data-del="${t.id}" aria-label="Delete ${t.name}">🗑</button>`:''}</div>`;
const goalCard=(g,i)=>{const p=Math.min(100,Math.round(g.current/g.target*100));return`<div class="card hov" style="background:${g.color}18;animation-delay:${i*70}ms"><span class="ico" style="background:${g.color}33">${g.icon}</span><h3 style="margin:.7rem 0 .2rem">${g.name}</h3><b style="font-size:1.3rem">${inr(g.current)}</b> <small>/ ${inr(g.target)}</small><div class="bar"><i data-w="${p}" style="background:${g.color}"></i></div><div style="display:flex;justify-content:space-between"><small>${inr(g.target-g.current)} remaining</small><b>${p}%</b></div></div>`};
/* demo AI: swap answer() for a real API call later */
const ANS={food:'You spent ₹4,820 on food this month across 18 transactions.',august:'September spending is ₹18,420, about 7% higher than August (₹17,200).',biggest:'Your biggest expenses: Amazon ₹2,499, Zara ₹2,100 and Petrol ₹1,500.',recurring:'You have 5 recurring payments totalling ₹1,567 per month (₹18,804 per year).',category:'Food 26%, Shopping 22%, Transport 18%, Bills 15%, Entertainment 10%.'};
const answer=async q=>{q=q.toLowerCase();const k=['food','august','biggest','recurring','category'].find(k=>q.includes(k))||(q.includes('expense')?'biggest':'');return ANS[k]||'This is a demo. Try asking about food, recurring payments or categories.'};
const SUG=['Compare this month with August','What were my biggest expenses?','Show my recurring payments','Show my spending by category'];
function chatInit(first){const log=$('#log'),add=(c,t)=>{log.insertAdjacentHTML('beforeend',`<div class="msg ${c}"></div>`);log.lastChild.textContent=t;return log.lastChild};
 const ask=async q=>{if(!q.trim())return;add('u',q);const m=add('a','…');const r=await answer(q);setTimeout(()=>m.textContent=r,450)};
 $('#af').onsubmit=e=>{e.preventDefault();const i=$('#aq');ask(i.value);i.value=''};$('#sug').onclick=e=>e.target.classList.contains('chip')&&ask(e.target.textContent);if(first)ask('How much did I spend on food?')}
const chatBox=(v='')=>`<div class="chat card"><div id="log"></div><form class="aform" id="af"><input id="aq" value="${v}" placeholder="Ask about your money..." aria-label="Ask a question"><button class="btn primary">Ask</button></form><div class="chips" id="sug" style="margin-top:.8rem">${SUG.map(s=>`<button class="chip">${s}</button>`).join('')}</div></div>`;
/* ---------- views ---------- */
const V={};
V.landing={land:1,h:()=>`<header class="lh"><a class="logo" href="#/"><i></i>Expense<b>IQ</b></a><nav><a href="#features">Features</a><a href="#insights">Insights</a><a href="#ask">How It Works</a><a href="#goals">About</a></nav><div class="act"><a class="btn" href="#/dashboard">Login</a><a class="btn primary" href="#/dashboard">Get Started</a></div></header>
<section class="hero"><div class="blob" style="width:380px;height:380px;background:var(--pink);right:5%;top:0"></div><div class="blob" style="width:300px;height:300px;background:var(--blue);right:30%;bottom:0"></div>
<div><h1>Smart Money.<br><b>Simple Life.</b></h1><p style="font-size:1.2rem;margin:1rem 0 .5rem">Your personal financial intelligence dashboard.</p><p class="sub" style="max-width:46ch">Track your spending, understand your habits, plan your goals, and make your money easier to understand.</p><div class="act" style="flex-wrap:wrap"><a class="btn primary" href="#/dashboard">Get Started →</a><button class="btn" data-toast="Demo video coming soon">Watch Demo</button></div><small style="display:block;margin-top:.8rem">No credit card required</small></div>
<div class="prev"><div class="card"><small>Available Balance</small><h2 style="font-size:2rem" data-n="24580"></h2><div class="act" style="gap:1.5rem;margin:.5rem 0"><span><small>Income</small><br><b class="up">₹30,000</b></span><span><small>Expenses</small><br><b class="down">₹18,420</b></span></div><div class="cb" style="height:110px"><canvas id="hc"></canvas></div><div class="grid gc" style="gap:.3rem .8rem;margin-top:.6rem;font-size:.85rem"><span>🍔 Food</span><b>₹4,820</b><span>🛍️ Shopping</span><b>₹4,100</b><span>🚗 Transport</span><b>₹3,250</b><span>💡 Bills</span><b>₹2,750</b></div></div><div class="card fl">💡 <b>Smart Insight</b><br><small>Your food spending increased by 34%.</small></div></div></section>
<section id="features"><h2 class="h2">Everything you need to understand your money</h2><div class="grid g3">${[['📊','Smart Analytics','Beautiful charts that explain where money goes.','#7C5CFC'],['💡','Spending Insights','Plain-language tips from your own habits.','#FF9F43'],['🎯','Money Goals','Set targets and watch progress fill up.','#2BCB8A'],['🔁','Recurring Expenses','Every subscription and bill in one place.','#4D8DFF'],['🧾','Expense Tracking','Log a payment in under ten seconds.','#FF4D5A'],['🔒','Secure & Private','Your data stays on your device in this demo.','#FF6FB5']].map(f=>`<div class="card hov"><span class="ico" style="background:${f[3]}22">${f[0]}</span><h3 style="margin:.8rem 0 .3rem">${f[1]}</h3><small>${f[2]}</small></div>`).join('')}</div></section>
<section id="insights"><div class="card ins" style="padding:3rem 1.5rem;border-radius:32px"><h2 class="h2">It's more than tracking.<br>It's understanding.</h2><div class="card" style="max-width:560px;margin:0 auto;color:var(--text)"><p>Your food spending increased by 34% compared with last month.</p><h2 style="margin:.4rem 0">₹3,580 → ₹4,820 <span class="down">+34.6%</span></h2><div class="cb" style="height:140px"><canvas id="ic"></canvas></div></div></div></section>

 i(){line('hc',[1,2,3,4,5,6,7,8],[3,5,4,7,6,9,8,11].map(x=>x*1000),'#7C5CFC',false);line('ic',[1,2,3,4,5],[3580,3900,4100,4400,4820],'#FF4D5A',false);chatInit()}};
V.dashboard={t:'Overview',h:()=>`<h1>Good morning, ${API.getSettings().name} 👋</h1><p class="sub">Here's your financial overview for September 2026.</p>
<div class="grid g4 k2" style="margin-bottom:1.25rem">${[['Balance',24580,'+8.4%','up'],['Income',30000,'+12%','up'],['Expenses',18420,'-4.2%','down'],['Savings',11580,'+16%','up']].map((s,i)=>`<div class="card stat s${i}" style="animation-delay:${i*70}ms"><small>${s[0]}</small><h2 data-n="${s[1]}"></h2><span class="${s[3]}">${s[2]}</span></div>`).join('')}</div>
<div class="grid g2"><div class="grid" style="align-content:start"><div class="card"><div class="act" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem"><b>Spending Overview</b><div class="chips" id="rg">${['This Week','This Month','3 Months','6 Months','This Year'].map((r,i)=>`<button class="chip ${i?'':'on'}">${r}</button>`).join('')}</div></div><div class="cb"><canvas id="c1"></canvas></div></div>
<div class="card ins"><h2>✨ Smart Insights</h2><p style="margin:.6rem 0 1rem;max-width:36ch">Your weekend spending is 24% higher than your weekday spending.</p><a class="btn" href="#/analytics" style="color:#7C5CFC">View Details →</a></div></div>
<div class="grid" style="align-content:start"><div class="card"><b>Top Categories</b>${(()=>{const c=byCat(),T=c.reduce((s,x)=>s+x[1],0);return c.slice(0,5).map(([k,v])=>`<div class="row"><span class="ico" style="background:${CATS[k][1]}22">${CATS[k][0]}</span><div class="g"><b>${k}</b><div class="bar"><i data-w="${Math.round(v/T*100)}" style="background:${CATS[k][1]}"></i></div></div><span class="amt">${inr(v)}<br><small>${Math.round(v/T*100)}%</small></span></div>`).join('')})()}</div>
<div class="card"><b>Recent Transactions</b>${API.getTransactions().slice(0,4).map(t=>txRow(t)).join('')}<a class="btn" href="#/transactions" style="width:100%;margin-top:.5rem">View All Transactions →</a></div></div></div>`,
 i(){const R=[[['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],[420,900,350,1200,800,2100,1600]],[['W1','W2','W3','W4','W5','W6'],[3200,4100,2800,5200,3900,4600]],[['Jul','Aug','Sep'],[15800,17200,18420]],[['Apr','May','Jun','Jul','Aug','Sep'],[14200,16800,15100,15800,17200,18420]],[['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'],[12000,13500,14800,14200,16800,15100,15800,17200,18420]]];
 const c=line('c1',...R[0]);$('#rg').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('#rg .on').classList.remove('on');b.classList.add('on');const r=R[[...b.parentNode.children].indexOf(b)];c.data.labels=r[0];c.data.datasets[0].data=r[1];c.update()}}};
V.transactions={t:'Transactions',h:()=>`<h1>Transactions</h1><p class="sub">Every rupee, in one place.</p><label class="field"><input id="q" type="search" placeholder="Search transactions..." aria-label="Search transactions"></label><div class="chips" id="cf" style="margin-bottom:1rem">${['All Categories','Food','Shopping','Transport','Bills','Entertainment'].map((c,i)=>`<button class="chip ${i?'':'on'}">${c}</button>`).join('')}</div><div id="list"></div><a class="fab" href="#/add-expense" aria-label="Add expense">+</a>`,
 i(){let cat='All Categories';const draw=()=>{const q=$('#q').value.toLowerCase(),t0=day(0),t1=day(1),g={Today:[],Yesterday:[],Earlier:[]};
 API.getTransactions().filter(t=>(cat[0]=='A'||t.category==cat)&&t.name.toLowerCase().includes(q)).forEach(t=>g[t.date==t0?'Today':t.date==t1?'Yesterday':'Earlier'].push(t));
 $('#list').innerHTML=Object.entries(g).filter(x=>x[1].length).map(([k,a])=>`<h3 style="margin:1rem 0 .3rem">${k}</h3><div class="card">${a.map(t=>txRow(t,1)).join('')}</div>`).join('')||'<div class="card">No transactions match. Try another filter.</div>'};
 $('#cf').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('#cf .on').classList.remove('on');b.classList.add('on');cat=b.textContent;draw()};$('#q').oninput=draw;
 $('#list').onclick=e=>{const b=e.target.closest('[data-del]');if(b){API.deleteTransaction(b.dataset.del);toast('Transaction deleted','warning');draw()}};draw()}};
V['add-expense']={t:'Transactions',h:()=>`<div style="max-width:520px;margin:0 auto"><h1>Add Expense</h1><p class="sub">Log it in seconds.</p><form class="card" id="f" novalidate><label class="field">Amount (₹)<input class="big" id="amt" type="number" inputmode="decimal" placeholder="₹ 1,250" min="1"></label><label class="field">Description<input id="ds" placeholder="Grocery shopping"></label><label class="field">Category<select id="ct"><option value="">Select category</option>${['Food','Shopping','Transport','Bills','Entertainment','Groceries'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field">Date<input id="dt" type="date" value="${day(0)}"></label><div class="field">Payment Method<div class="pay">${['Cash','Card','UPI','Bank'].map((p,i)=>`<label><input type="radio" name="pm" value="${p}" ${i?'':'checked'}>${p}</label>`).join('')}</div></div><label class="field">Notes<textarea id="nt" rows="2"></textarea></label><button class="btn primary" style="width:100%">Add Expense</button></form></div>`,
 i(){$('#f').onsubmit=e=>{e.preventDefault();let ok=true;[['#amt',+$('#amt').value>0],['#ds',$('#ds').value.trim()],['#ct',$('#ct').value]].forEach(([s,v])=>{$(s).closest('.field').classList.toggle('err',!v);if(!v)ok=false});
 if(!ok)return toast('Please fill the highlighted fields','error');API.addTransaction({name:$('#ds').value.trim(),category:$('#ct').value,amount:-Math.abs(+$('#amt').value),date:$('#dt').value,method:e.target.pm.value,notes:$('#nt').value});
 toast('Expense added successfully ✓');setTimeout(()=>location.hash='#/transactions',900)}}};
V.analytics={t:'Analytics',h:()=>{const T=byCat().reduce((s,x)=>s+x[1],0);return`<h1>Analytics</h1><p class="sub">See the shape of your spending.</p><div class="chips" style="margin-bottom:1rem">${['This Month','Last Month','3 Months','6 Months','1 Year'].map((r,i)=>`<button class="chip ${i?'':'on'}" data-toast="Showing ${r} (demo data)" data-t="info">${r}</button>`).join('')}</div>
<div class="grid gc"><div class="card s0"><small>Total Expenses</small><h2 style="font-size:2rem" data-n="${T}"></h2><span class="down">+12.4% from last month</span></div><div class="card"><div class="cb" style="height:180px"><canvas id="a1"></canvas></div></div>
<div class="card"><b>Spending Trend</b><div class="cb"><canvas id="a2"></canvas></div></div><div class="card"><b>Income vs Expenses</b><div class="cb"><canvas id="a3"></canvas></div></div>
<div class="card"><b>Monthly Comparison</b><div class="cb"><canvas id="a4"></canvas></div></div><div class="card"><b>Top Spending Categories</b>${byCat().slice(0,5).map(([k,v])=>`<div class="row"><span class="ico" style="background:${CATS[k][1]}22">${CATS[k][0]}</span><div class="g"><b>${k}</b><div class="bar"><i data-w="${Math.round(v/T*100)}" style="background:${CATS[k][1]}"></i></div></div><b>${inr(v)}</b></div>`).join('')}</div></div>`},
 i(){const c=byCat(),col=c.map(x=>CATS[x[0]][1]),o={responsive:true,maintainAspectRatio:false},M=['Apr','May','Jun','Jul','Aug','Sep'];
 new Chart('a1',{type:'doughnut',data:{labels:c.map(x=>x[0]),datasets:[{data:c.map(x=>x[1]),backgroundColor:col,borderWidth:0}]},options:{...o,cutout:'68%',plugins:{legend:{position:'right'}}}});
 line('a2',['1','5','10','15','20','25','30'],[1200,2400,1800,4200,3100,5200,4300],'#7C5CFC');
 new Chart('a3',{type:'bar',data:{labels:M,datasets:[{label:'Income',data:Array(6).fill(30000),backgroundColor:'#2BCB8A',borderRadius:8},{label:'Expenses',data:[14200,16800,15100,15800,17200,18420],backgroundColor:'#FF4D5A',borderRadius:8}]},options:o});
 new Chart('a4',{type:'bar',data:{labels:c.map(x=>x[0]),datasets:[{label:'Aug',data:c.map(x=>x[1]*.9),backgroundColor:'#4D8DFF',borderRadius:8},{label:'Sep',data:c.map(x=>x[1]),backgroundColor:'#FF6FB5',borderRadius:8}]},options:o})}};
V.goals={t:'Goals',h:()=>`<div class="act" style="justify-content:space-between;flex-wrap:wrap"><div><h1>My Goals</h1><p class="sub">Small steps toward big things.</p></div><button class="btn primary" id="ng">+ Create Goal</button></div><div class="grid ga" id="gl">${API.getGoals().map(goalCard).join('')}</div>`,
 i(){$('#ng').onclick=()=>modal('Create New Goal',[['name','Goal name'],['target','Target amount (₹)','number'],['current','Current amount (₹)','number',0],['date','Target date','date'],['icon','Icon (emoji)','text','🎯'],['color','Color','color','#7C5CFC']],d=>{if(!d.name.trim()||+d.target<=0){toast('Enter a name and target amount','error');return false}
 API.addGoal({...d,target:+d.target,current:+d.current||0});toast('Goal created successfully ✓');route()})}};
V.recurring={t:'Recurring',h:()=>{const l=API.getRecurring(),m=l.reduce((s,r)=>s+r.amount,0);return`<div class="act" style="justify-content:space-between;flex-wrap:wrap"><div><h1>Recurring Expenses</h1><p class="sub">Know what leaves your account every month.</p></div><button class="btn primary" id="nr">+ Add Recurring Expense</button></div>
<div class="grid gc"><div class="card">${l.map(r=>`<div class="row"><span class="ico" style="background:${r.color}22">${r.icon}</span><div class="g"><b>${r.name}</b><small>Monthly</small></div><b>${inr(r.amount)}</b></div>`).join('')}</div>
<div class="grid" style="align-content:start"><div class="card s0"><small>Monthly recurring</small><h2 style="font-size:2rem" data-n="${m}"></h2></div><div class="card s2"><small>Estimated yearly</small><h2 style="font-size:2rem" data-n="${m*12}"></h2></div><div class="card ins"><b>💡 You can save up to ₹2,000 per year</b><br><small>by reviewing unused subscriptions.</small></div></div></div>`},
 i(){$('#nr').onclick=()=>modal('Add Recurring Expense',[['name','Name'],['amount','Amount per month (₹)','number']],d=>{if(!d.name.trim()||+d.amount<=0){toast('Enter a name and amount','error');return false}
 API.addRecurring({name:d.name.trim(),amount:+d.amount,icon:'🔁',color:'#7C5CFC'});toast('Recurring expense added ✓');route()})}};
V.calendar={t:'Calendar',h:()=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),tot={};
 API.getTransactions().filter(t=>t.amount<0).forEach(t=>tot[t.date]=(tot[t.date]||0)-t.amount);
 const cells=Array(first).fill('<span></span>').concat(Array.from({length:days},(_,i)=>{const d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,v=tot[d]||0;return`<button data-d="${d}">${i+1}${v?`<i style="background:${v>2000?'#FF4D5A':v>800?'#FF9F43':'#2BCB8A'}"></i>`:''}</button>`}));
 return`<h1>Calendar</h1><p class="sub">${n.toLocaleString('en',{month:'long'})} ${y} · <span class="down">●</span> high <span style="color:var(--orange)">●</span> medium <span class="up">●</span> low</p><div class="grid gc"><div class="card"><div class="cal">${'MTWTFSS'.split('').map(d=>`<small>${d}</small>`).join('')}${cells.join('')}</div></div><div class="card"><b id="dh">Select a date</b><div id="dl"></div></div></div>`},
 i(){$('.cal').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;document.querySelector('.cal .on')?.classList.remove('on');b.classList.add('on');const l=API.getTransactions().filter(t=>t.date==b.dataset.d);$('#dh').textContent='Transactions on '+b.dataset.d;$('#dl').innerHTML=l.map(t=>txRow(t)).join('')||'<small>No transactions on this day.</small>'};document.querySelector(`[data-d="${day(0)}"]`)?.click()}};
V['ask-expenseiq']={t:'Ask',h:()=>`<div style="max-width:720px;margin:0 auto;text-align:center"><h1>Ask ExpenseIQ ✨</h1><p class="sub">Understand your money naturally.</p>${chatBox()}</div>`,i:()=>chatInit(1)};
V.settings={t:'Settings',h:()=>{const s=API.getSettings(),tg=(k,l)=>`<label class="row" style="justify-content:space-between">${l}<input class="tg" type="checkbox" data-k="${k}" ${s[k]?'checked':''}></label>`;return`<h1>Settings</h1><p class="sub">Make ExpenseIQ yours.</p><div class="grid gc" style="align-items:start"><div class="card"><h3>Profile</h3><div class="row"><span class="av">${s.name[0]}</span><button class="btn" data-toast="Photo upload arrives with the backend" data-t="info">Change Photo</button></div><label class="field">Name<input id="sn" value="${s.name}"></label><label class="field">Email<input id="se" type="email" value="${s.email}"></label></div>
<div class="card"><h3>Preferences</h3>${tg('dark','Dark Mode')}${tg('monday','Week starts Monday')}<label class="field">Currency<select id="sc"><option value="INR">₹ INR</option><option value="USD">$ USD</option></select></label></div>
<div class="card"><h3>Notifications</h3>${tg('n1','Expense reminders')}${tg('n2','Goal reminders')}${tg('n3','Recurring payment reminders')}</div>
<div class="card"><h3>Security</h3><button class="btn" style="width:100%;margin:.4rem 0" data-toast="Password change arrives with the backend" data-t="info">Change Password</button><button class="btn" style="width:100%;margin:.4rem 0" data-toast="1 active session: this device" data-t="info">Active Sessions</button><a class="btn" style="width:100%;color:var(--red)" href="#/">Logout</a></div></div><button class="btn primary" id="sv" style="margin-top:1.25rem">Save changes</button>`},
 i(){$('#sc').value=API.getSettings().currency;document.querySelector('[data-k=dark]').onchange=e=>{const s=API.getSettings();s.dark=e.target.checked;API.saveSettings(s);applyTheme()};
 $('#sv').onclick=()=>{const s={...API.getSettings(),name:$('#sn').value.trim()||'Vinoth',email:$('#se').value,currency:$('#sc').value};document.querySelectorAll('[data-k]').forEach(k=>s[k.dataset.k]=k.checked);API.saveSettings(s);applyTheme();toast('Settings saved ✓');route()}}};
/* ---------- shell + router ---------- */
const NAV=[['Overview','dashboard','🏠'],['Transactions','transactions','💳'],['Analytics','analytics','📊'],['Goals','goals','🎯'],['Recurring','recurring','🔁'],['Calendar','calendar','📅'],['Ask ExpenseIQ','ask-expenseiq','✨'],['Reports','reports','📄']];
function shell(v,body){const n=API.getSettings().name,on=x=>V[v].t==(V[x]||{}).t?'on':'';
 return`<div class="veil" id="veil"></div><aside class="side" id="side"><a class="logo" href="#/"><i></i>Expense<b>IQ</b></a>${NAV.map(x=>V[x[1]]?`<a class="${on(x[1])}" href="#/${x[1]}">${x[2]} ${x[0]}</a>`:`<a href="#" data-toast="Reports are coming soon" data-t="info">${x[2]} ${x[0]}</a>`).join('')}<hr><a class="${on('settings')}" href="#/settings">⚙️ Settings</a><a href="#/">↩ Logout</a></aside>
<div class="wrap"><header class="top"><button class="ib burger" id="bg" aria-label="Open menu">☰</button><input class="search" placeholder="Search anything..." aria-label="Search"><span class="sp"></span><button class="ib" data-toast="You have 2 new insights" data-t="info" aria-label="Notifications">🔔</button><button class="ib" id="th" aria-label="Toggle dark mode">🌓</button><span class="av">${n[0]}</span><b class="uname">${n}</b></header><main>${body}</main></div>
<nav class="bnav">${[['dashboard','🏠','Home'],['transactions','💳','Activity'],['add-expense','➕','Add'],['goals','🎯','Goals'],['ask-expenseiq','✨','Ask']].map(x=>`<a class="${v==x[0]?'on':''}" href="#/${x[0]}"><span>${x[1]}</span>${x[2]}</a>`).join('')}</nav>`}
function route(){const v=location.hash.startsWith('#/')?location.hash.slice(2):'landing',k=V[v]?v:'landing',p=V[k];
 $('#root').innerHTML=p.land?p.h():shell(k,p.h());
 if(!p.land){const s=$('#side'),vl=$('#veil'),t=o=>{s.classList.toggle('open',o);vl.classList.toggle('open',o)};$('#bg').onclick=()=>t(true);vl.onclick=()=>t(false);s.onclick=e=>e.target.closest('a')&&t(false);
  $('#th').onclick=()=>{const c=API.getSettings();c.dark=!c.dark;API.saveSettings(c);applyTheme()}}
 document.querySelectorAll('[data-n]').forEach(e=>countUp(e,+e.dataset.n));p.i&&p.i();
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.bar i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),80))}
addEventListener('hashchange',()=>{if(/^#\/[\w-]*$/.test(location.hash)||!location.hash){route();scrollTo(0,0)}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t){e.preventDefault();toast(t.dataset.toast,t.dataset.t||'info')}});
route();
</script></body></html>
